dependencies:
  idf:
    version: ">=5.5.0"
  waveshare/esp_lcd_jd9365_10_1:
    version: "^2.0.0"
  espressif/esp_new_jpeg:
    version: "^1.0.0"
  lvgl/lvgl:
    version: "~9.3.0"
  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    # Pinned, not "*". 3.1.0 moved its USB transport dependencies behind
    # "if: ESP_HOSTED_HOST_USB_*_MANIFEST" rules in its own manifest. With an
    # open range the component manager evaluates those rules while the locked
    # 3.0.6 Kconfig is what is actually loaded, so the symbols are undefined
    # and the configure step dies with "Missing required kconfig option after
    # retry." The SDIO pin and queue settings in sdkconfig.defaults are
    # written against 3.0.6's post-rename HOST_ symbol names as well.
    version: "~3.0.6"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch:
    version: "^1.1.0"
